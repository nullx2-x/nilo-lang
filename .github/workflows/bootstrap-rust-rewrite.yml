name: Bootstrap Rust rewrite

on:
  pull_request:
    branches: [main]

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: rust-rewrite-fix-validation
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out fix branch
        uses: actions/checkout@v4
        with:
          ref: agent/rust-rewrite-fix
          fetch-depth: 0

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo data
        uses: Swatinem/rust-cache@v2

      - name: Apply fixes and format Rust source
        shell: bash
        run: |
          set -euo pipefail
          python3 .ci/apply_fixes.py
          cargo fmt --all
          if ! git diff --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -A
            git commit -m 'fix: resolve Rust compiler errors'
            git push origin HEAD:agent/rust-rewrite-fix
          fi

      - name: Validate Rust and Nilo implementation
        id: validate
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          {
            cargo clippy --all-targets --all-features -- -D warnings &&
            cargo test --all-targets &&
            cargo run --quiet -- check examples/main.nilo &&
            cargo run --quiet -- examples/main.nilo &&
            cargo run --quiet -- test tests
          } 2>&1 | tee validation.log

      - name: Upload validation log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nilo-rust-validation-fix
          path: validation.log
          if-no-files-found: warn

      - name: Publish validation diagnostic
        if: always()
        uses: actions/github-script@v7
        env:
          VALIDATION_OUTCOME: ${{ steps.validate.outcome }}
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- nilo-bootstrap-validation -->';
            const raw = fs.existsSync('validation.log')
              ? fs.readFileSync('validation.log', 'utf8')
              : 'No validation output was produced.';
            const output = raw.length > 55000 ? raw.slice(-55000) : raw;
            const icon = process.env.VALIDATION_OUTCOME === 'success' ? '✅' : '❌';
            const body = `${marker}\n### ${icon} Nilo Rust validation\n\n` +
              `<details open><summary>cargo output</summary>\n\n\`\`\`text\n${output}\n\`\`\`\n</details>`;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number, per_page: 100,
            });
            const existing = comments.find(comment =>
              comment.user?.type === 'Bot' && comment.body?.includes(marker)
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner, repo, comment_id: existing.id, body,
              });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

      - name: Fail when validation failed
        if: steps.validate.outcome == 'failure'
        run: exit 1
