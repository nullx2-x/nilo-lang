name: Bootstrap Rust rewrite

on:
  push:
    branches:
      - agent/rust-native-runtime
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

concurrency:
  group: rust-rewrite-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  rewrite:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Reconstruct and verify implementation archive
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/archive.part* | tr -d '\r\n\t ' | base64 --decode > /tmp/nilo-rust-rewrite.tar.gz
          echo "archive bytes: $(wc -c < /tmp/nilo-rust-rewrite.tar.gz)"
          sha256sum /tmp/nilo-rust-rewrite.tar.gz
          tar -tzf /tmp/nilo-rust-rewrite.tar.gz >/dev/null
          mkdir -p /tmp/nilo-new
          tar -xzf /tmp/nilo-rust-rewrite.tar.gz -C /tmp/nilo-new

      - name: Replace Python prototype with Rust implementation
        shell: bash
        run: |
          set -euo pipefail
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a /tmp/nilo-new/. .

      - name: Format Rust sources
        run: cargo fmt --all

      - name: Compile and run Rust tests
        run: cargo test --all-targets --all-features

      - name: Run Nilo language regression tests
        run: cargo run -- test tests

      - name: Run CLI smoke tests
        shell: bash
        run: |
          set -euo pipefail
          cargo run -- check examples/language_tour.nilo
          cargo run -- examples/main.nilo
          cargo run -- eval 'assert(6 * 7 == 42, "evaluation failed"); print("eval ok");'

      - name: Commit verified Rust rewrite
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Rewrite Nilo runtime in Rust"
          git push origin HEAD:agent/rust-native-runtime
