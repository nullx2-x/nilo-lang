name: Bootstrap Rust rewrite

on:
  push:
    branches:
      - agent/rust-rewrite
    paths:
      - .bootstrap/**
      - .github/workflows/bootstrap-rust-rewrite.yml

permissions:
  contents: write

concurrency:
  group: bootstrap-rust-rewrite
  cancel-in-progress: false

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - name: Check out rewrite branch
        uses: actions/checkout@v4
        with:
          ref: agent/rust-rewrite
          fetch-depth: 0

      - name: Verify and install Rust rewrite
        shell: bash
        run: |
          set -euo pipefail

          cat .bootstrap/archive.part* | base64 --decode > /tmp/nilo-rust.tar.gz
          echo '4b6215396f87ea5c5ec1b82048c2e32ff1b6d47880fd65f8f987c9c63f9e0943  /tmp/nilo-rust.tar.gz' | sha256sum --check --strict
          tar -tzf /tmp/nilo-rust.tar.gz >/dev/null

          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          tar -xzf /tmp/nilo-rust.tar.gz -C .

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Rewrite Nilo interpreter and CLI in Rust'
          git push origin HEAD:agent/rust-rewrite
